x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: Dockerfile

  image: weather-data-platform-airflow:3.3.1

  env_file:
    - .env

  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: CeleryExecutor

    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager

    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg://${AIRFLOW_DB_USER}:${AIRFLOW_DB_PASSWORD}@airflow-postgres/${AIRFLOW_DB_NAME}

    AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql+psycopg://${AIRFLOW_DB_USER}:${AIRFLOW_DB_PASSWORD}@airflow-postgres/${AIRFLOW_DB_NAME}

    AIRFLOW__CELERY__BROKER_URL: redis://:@redis:6379/0

    AIRFLOW__CORE__FERNET_KEY: ${FERNET_KEY}

    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"

    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/

    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW__API_AUTH__JWT_SECRET}
    AIRFLOW__API_AUTH__JWT_ISSUER: airflow

    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"

    AIRFLOW__CELERY__WORKER_CONCURRENCY: "2"
    AIRFLOW__DAG_PROCESSOR__PARSING_PROCESSES: "1"

    AIRFLOW_CONN_DATA_POSTGRES: postgresql://${DATA_DB_USER}:${DATA_DB_PASSWORD}@data-postgres:5432/${DATA_DB_NAME}

  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/logs:/opt/airflow/logs
    - ./airflow/plugins:/opt/airflow/plugins
    - ./airflow/config:/opt/airflow/config

  user: "${AIRFLOW_UID:-50000}:0"

  networks:
    - weather-network

  depends_on:
    airflow-postgres:
      condition: service_healthy

    redis:
      condition: service_healthy


x-airflow-runtime: &airflow-runtime
  <<: *airflow-common

  depends_on:
    airflow-postgres:
      condition: service_healthy

    redis:
      condition: service_healthy

    airflow-init:
      condition: service_completed_successfully


services:

  airflow-postgres:
    image: postgres:16

    environment:
      POSTGRES_USER: ${AIRFLOW_DB_USER}
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD}
      POSTGRES_DB: ${AIRFLOW_DB_NAME}

    volumes:
      - airflow_postgres_data:/var/lib/postgresql/data

    networks:
      - weather-network

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${AIRFLOW_DB_USER} -d ${AIRFLOW_DB_NAME}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

    restart: unless-stopped


  data-postgres:
    image: postgres:16

    environment:
      POSTGRES_USER: ${DATA_DB_USER}
      POSTGRES_PASSWORD: ${DATA_DB_PASSWORD}
      POSTGRES_DB: ${DATA_DB_NAME}

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - data_postgres_data:/var/lib/postgresql/data

    networks:
      - weather-network

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DATA_DB_USER} -d ${DATA_DB_NAME}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

    restart: unless-stopped


  redis:
    image: redis:7.2-bookworm

    networks:
      - weather-network

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

    restart: unless-stopped


  airflow-init:
    <<: *airflow-common

    environment:
      <<: *airflow-common-env

      _AIRFLOW_DB_MIGRATE: "true"

      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_ADMIN_USER}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD}

    command: version


  airflow-apiserver:
    <<: *airflow-runtime

    command: api-server

    ports:
      - "127.0.0.1:8080:8080"

    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "--fail",
          "http://localhost:8080/api/v2/monitor/health"
        ]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 30s

    restart: unless-stopped


  airflow-scheduler:
    <<: *airflow-runtime

    command: scheduler

    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "--fail",
          "http://localhost:8974/health"
        ]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 30s

    restart: unless-stopped


  airflow-dag-processor:
    <<: *airflow-runtime

    command: dag-processor

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "airflow jobs check --job-type DagProcessorJob --hostname \"$${HOSTNAME}\""
        ]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 30s

    restart: unless-stopped


  airflow-triggerer:
    <<: *airflow-runtime

    command: triggerer

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "airflow jobs check --job-type TriggererJob --hostname \"$${HOSTNAME}\""
        ]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 30s

    restart: unless-stopped


  airflow-worker:
    <<: *airflow-runtime

    command: celery worker

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "celery --app airflow.providers.celery.executors.celery_executor.app inspect ping -d \"celery@$${HOSTNAME}\""
        ]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 30s

    restart: unless-stopped


volumes:
  airflow_postgres_data:
  data_postgres_data:


networks:
  weather-network:
    driver: bridge