version: 2

models:

  - name: stg_weather_snapshots
    description: >
      Données météo issues de la couche raw, nettoyées et renommées pour les transformations dbt

    columns:

      - name: observation_id
        data_tests:
          - not_null
          - unique

      - name: city
        data_tests:
          - not_null

      - name: observed_at
        data_tests:
          - not_null

      - name: temperature_c
        data_tests:
          - not_null

      - name: humidity_pct
        data_tests:
          - not_null

      - name: ingested_at
        data_tests:
          - not_null

  - name: dim_city_current
    description: >
      Version actuellement valide des métadonnées
      de chaque ville, construite à partir du snapshot dbt.

    columns:

      - name: city
        data_tests:
          - not_null
          - unique

      - name: latitude
        data_tests:
          - not_null

      - name: longitude
        data_tests:
          - not_null

      - name: valid_from
        data_tests:
          - not_null