version: 2

models:

  - name: stg_weather_snapshots
    description: >
      Données météo issues de la couche raw,
      nettoyées et renommées pour les transformations dbt.

    columns:

      - name: observation_id
        data_tests:
          - not_null
          - unique

      - name: city
        data_tests:
          - not_null

      - name: observed_at
        data_tests:
          - not_null

      - name: temperature_c
        data_tests:
          - not_null

      - name: humidity_pct
        data_tests:
          - not_null

      - name: ingested_at
        data_tests:
          - not_null